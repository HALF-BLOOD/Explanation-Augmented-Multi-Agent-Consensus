models:
  - name: gptoss120b
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    min_interval_s: 2.5
    max_tokens_override: 3000   # reasoning tokens count against the cap
  - name: gemini-flash
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    min_interval_s: 50
    max_tokens_override: 3000
  - name: qwen27b
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b
    api_key_env: GROQ_API_KEY   # shares groq's rate gate with gptoss120b
    min_interval_s: 2.5
    max_tokens_override: 3000

  # nvidia's free NIM endpoint served deepseek fine in the morning smoke
  # test, then started hanging every request by early afternoon (their
  # queue, not our code). Kept as a spare fourth family -- re-enable when
  # it behaves, or route deepseek through openrouter instead.
  # - name: deepseek-flash
  #   kind: openai_compat
  #   base_url: https://integrate.api.nvidia.com/v1
  #   model: deepseek-ai/deepseek-v4-flash-0731
  #   api_key_env: DEEPSEEK_API_KEY   # nvapi- key from build.nvidia.com
  #   min_interval_s: 1.6
  #   max_tokens_override: 3000

excre:
  rounds: 3
  devils_advocate: true
  anchor: true
  convergence_eps: 0.02
  temperature: 0.3
  max_tokens: 900

imrc:
  embedder: lexical   # switch to sbert once sentence-transformers is installed
  sbert_model: sentence-transformers/all-mpnet-base-v2
  alpha: 0.5
  beta: 0.2
  gamma: 0.3
  evidence_threshold: 0.5

trust:
  w_agreement: 0.35
  w_imrc: 0.35
  w_confidence: 0.20
  w_converged: 0.10

sc:
  k: 5
  temperature: 0.7

judge:
  model: gptoss120b

cache: true
cache_dir: .cache/llm
