# Walked one question at a time: question 1 of every dataset goes through
# every stage that lists that dataset, then question 2, and so on. A stage
# drops out once its n questions are done, so the early questions cost the
# most and the side stages are complete long before core is. Core runs to
# the 300 questions drawn per dataset; stop whenever time is up, every stage
# has run on the same leading questions of each of its datasets. To go past
# 300 later, raise n: the sample is extended at the same dataset revision.
config: configs/main.yaml
out: runs/v3
cache: runs/cache

stages:
  - name: core
    n: 300
    datasets: [gsm8k, strategyqa, truthfulqa, arc_challenge, mmlu]
    systems:
      - cot:gptoss120b
      - cot:qwen27b
      - cot:gemini-flash-lite
      - excre
      - mad                       # round 0 is the three cot calls, cached
      - sc:gemini-flash-lite

  - name: saboteur
    n: 40
    datasets: [gsm8k, truthfulqa]
    systems: [excre_adv, mad_adv]

  - name: ablations
    n: 40
    datasets: [strategyqa]
    systems: [excre_bare, excre_noda, excre_noanchor]

  - name: same-model
    n: 30
    datasets: [strategyqa]
    systems: ["excre_same:qwen27b"]

  - name: baselines
    n: 30
    datasets: [strategyqa, truthfulqa, arc_challenge]
    systems: [judge, reconcile]   # judge reuses the cached cot answers
